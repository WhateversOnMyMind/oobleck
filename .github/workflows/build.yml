name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Install ffmpeg (remux test; skipped cleanly if unavailable)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive timeout 400 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  playback:
    # Informational: needs the runner's apt mirrors (libmpv), which are occasionally unreachable.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Install libmpv and ffmpeg
        timeout-minutes: 12
        run: |
          sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive timeout 400 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends libmpv2 ffmpeg
      - run: flutter pub get
      - name: Playback smoke tests (real libmpv, public HLS stream)
        run: flutter test test/playback_smoke_test.dart test/player_session_test.dart
        env:
          OOBLECK_PLAYBACK: '1'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath oobleck-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: oobleck-windows
          path: oobleck-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Release signing key (from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oobleck-release.jks"
            echo "OOBLECK_KEYSTORE=$RUNNER_TEMP/oobleck-release.jks" >> "$GITHUB_ENV"
            echo "OOBLECK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD not set: APKs use a throwaway debug key and cannot update an existing install."
          fi
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: oobleck-android
          path: build/app/outputs/flutter-apk/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
