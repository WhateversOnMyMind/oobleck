name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libmpv2 ffmpeg
      - run: flutter pub get
      - name: Playback smoke tests (real libmpv, public HLS stream)
        run: flutter test test/playback_smoke_test.dart test/player_session_test.dart
        env:
          OOBLECK_PLAYBACK: '1'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath oobleck-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: oobleck-windows
          path: oobleck-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: oobleck-android
          path: build/app/outputs/flutter-apk/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, playback, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
